<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ file_name }}</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Raleway|Delius">
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            font-family: 'Raleway', sans-serif;
            overflow-x: hidden;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        marquee { font-size: 18px; font-weight: 600; color: #fff; background: rgba(0,0,0,0.9); padding: 10px; font-family: 'Delius', serif; width: 100%; }
        .container { width: 100%; background: #000; position: relative; }
        .video-js { width: 100% !important; height: auto !important; aspect-ratio: 16 / 9; }

        /* HIDE NATIVE DOWNLOAD CONTROLS */
        video::-webkit-media-controls-download-button { display: none !important; }
        video::-webkit-media-controls-enclosure { overflow: hidden !important; }

        .vjs-tech { object-fit: contain; }
        .tap-indicator { position: absolute; top: 50%; transform: translateY(-50%); font-size: 60px; color: rgba(255,255,255,0.95); pointer-events: none; z-index: 10000; animation: tapFade 0.5s ease-out forwards; }
        .tap-indicator.left  { left: 50px; }
        .tap-indicator.right { right: 50px; }
        @keyframes tapFade { 0% { opacity: 1; transform: translateY(-50%) scale(0.8); } 50% { transform: translateY(-50%) scale(1.2); } 100% { opacity: 0; transform: translateY(-50%) scale(0.8); } }
        .vjs-control-bar { background: linear-gradient(transparent, rgba(0,0,0,0.85)) !important; }
        .vjs-big-play-button { border-radius: 50% !important; width: 2em !important; height: 2em !important; line-height: 2em !important; left: 50% !important; top: 50% !important; transform: translate(-50%, -50%) !important; }
        .vjs-quality-button .vjs-icon-placeholder::before { content: 'HD'; font-size: 1.5em; line-height: 1.67; }

        /* Resume badge ("Continue from …" / "Start over") */
        .resume-badge {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            align-items: center;
            background: rgba(0,0,0,0.85);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 999px;
            padding: 8px 12px;
            z-index: 10001;
            font-family: 'Raleway', sans-serif;
            white-space: nowrap;
            animation: resumeIn 0.25s ease-out;
        }
        .resume-badge .resume-btn {
            background: rgba(255,255,255,0.12);
            border: 0;
            color: #fff;
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            padding: 8px 14px;
            border-radius: 999px;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
        }
        .resume-badge .resume-btn:hover { background: rgba(255,255,255,0.22); }
        .resume-badge .resume-btn:active { transform: scale(0.97); }
        .resume-badge .resume-continue { background: #2c5282; color: #fff; }
        .resume-badge .resume-continue:hover { background: #1a365d; }
        @keyframes resumeIn { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }

        @media (max-width: 768px) {
            marquee { font-size: 14px; }
            .tap-indicator { font-size: 48px; }
            .resume-badge { bottom: 70px; padding: 6px 10px; gap: 8px; }
            .resume-badge .resume-btn { font-size: 12px; padding: 7px 12px; }
        }
    </style>
</head>
<body>
    <header><marquee><div id="file-name">{{ file_name }}</div></marquee></header>

    <div class="container">
        <!-- Fixed: closed the video tag properly before the source -->
        <video id="player"
            class="video-js vjs-default-skin vjs-big-play-centered"
            controls
            preload="metadata"
            playsinline
            controlsList="nodownload"
            oncontextmenu="return false;"
            crossorigin="anonymous">
            <!-- These links are direct Telegram media streams, not HLS playlists. -->
            <source src="{{ file_url }}" type="{{ mime_type or 'video/mp4' }}">
        </video>
    </div>

    <!-- Video.js core -->
    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
    <!-- Quality Levels plugin (for custom menu) -->
    <script src="https://cdn.jsdelivr.net/npm/videojs-contrib-quality-levels@4.1.0/dist/videojs-contrib-quality-levels.min.js"></script>

    <!-- Google IMA SDK (required for VAST ads) -->
    <script src="https://imasdk.googleapis.com/js/sdkloader/ima3.js"></script>
    <!-- Video.js IMA plugin -->
    <script src="https://cdn.jsdelivr.net/npm/videojs-ima@2/dist/videojs.ima.min.js"></script>

    <script>
    (function() {
        'use strict';
        const playerElement = document.getElementById('player');
        const container = document.querySelector('.container');
        const isVideo = playerElement.tagName.toLowerCase() === 'video';
        let lastTapTime = 0, lastTapSide = null;

        // Custom Quality Button — ES6 class extends the MenuButton component.
        const MenuButton = videojs.getComponent('MenuButton');
        class QualityButton extends MenuButton {
            constructor(p, o) {
                super(p, o);
                this.addClass('vjs-quality-button');
                this.controlText('Quality');
            }
            createItems() {
                const items = [];
                const levels = this.player().qualityLevels();
                if (!levels) return items;
                const MenuItem = videojs.getComponent('MenuItem');
                items.push(new MenuItem(this.player(), { label: 'Auto', selected: true, selectable: true }));
                const heights = [];
                for (let i = 0; i < levels.length; i++) {
                    if (levels[i].height && !heights.includes(levels[i].height)) heights.push(levels[i].height);
                }
                heights.sort((a, b) => b - a).forEach(h => {
                    const item = new MenuItem(this.player(), { label: h + 'p', selectable: true });
                    item.on('click', () => {
                        for (let i = 0; i < levels.length; i++) levels[i].enabled = (levels[i].height === h);
                    });
                    items.push(item);
                });
                return items;
            }
        }
        videojs.registerComponent('QualityButton', QualityButton);

        // Build the ADX VAST tag with a random correlator
        const baseAdTag = "https://pubads.g.doubleclick.net/gampad/live/ads?iu=/23205238319/main_video_adunit&description_url=https%3A%2F%2Fweb.afrahtafreeh.site&tfcd=0&npa=0&sz=640x480&gdfp_req=1&unviewed_position_start=1&output=vast&env=vp&impl=s";
        const correlator = Math.floor(Math.random() * 10000000000);
        const adTagUrl = baseAdTag + "&correlator=" + correlator;

        // Ads are OFF by default. Set to `true` to enable pre-roll ads via IMA.
        const ENABLE_ADS = false;

        const player = videojs('player', {
            playbackRates: [0.5, 1, 1.5, 2, 2.5, 3],
            nativeControlsForTouch: false,
            controlBar: {
                children: ['playToggle', 'progressControl', 'volumePanel', 'qualityButton', 'playbackRateMenuButton', 'fullscreenToggle']
            },
            html5: {
                vhs: {
                    overrideNative: true,
                    enableLowInitialPlaylist: true,
                    fastQualityChange: true,
                    useBandwidthFromLocalStorage: true
                }
            }
        });

        if (ENABLE_ADS) {
            try { player.ima({ adTagUrl: adTagUrl }); } catch (e) {}
        }

        // Persist progress by user + lecture, not by the temporary Telegram
        // message ID. This lets a reconnect resume without downloading old
        // ranges and does not create another daily lecture claim.
        const mediaUrl = new URL("{{ file_url }}", window.location.href);
        const progressParams = new URLSearchParams({
            access_code: mediaUrl.searchParams.get('access_code') || '',
            lecture_key: mediaUrl.searchParams.get('lecture_key') || ''
        });
        const progressUrl = '/api/progress?' + progressParams.toString();
        let progressLoaded = false;
        let lastSavedPosition = -1;
        let saveInFlight = false;

        function formatResumeTime(seconds) {
            const total = Math.max(0, Math.floor(Number(seconds) || 0));
            const h = Math.floor(total / 3600);
            const m = Math.floor((total % 3600) / 60);
            const s = total % 60;
            const pad = (n) => String(n).padStart(2, '0');
            return h > 0 ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
        }

        function showResumeBadge(containerEl, position, onContinue) {
            if (!containerEl || !Number.isFinite(position)) return;
            const existing = document.getElementById('resumeBadge');
            if (existing) existing.remove();

            const badge = document.createElement('div');
            badge.id = 'resumeBadge';
            badge.className = 'resume-badge';

            const continueBtn = document.createElement('button');
            continueBtn.type = 'button';
            continueBtn.className = 'resume-btn resume-continue';
            continueBtn.textContent = `▶ Continue from ${formatResumeTime(position)}`;
            continueBtn.addEventListener('click', (e) => {
                e.preventDefault();
                e.stopPropagation();
                dismiss();
                try { onContinue && onContinue(); } catch (_) {}
            });

            const startOverBtn = document.createElement('button');
            startOverBtn.type = 'button';
            startOverBtn.className = 'resume-btn resume-startover';
            startOverBtn.textContent = 'Start over';
            startOverBtn.addEventListener('click', (e) => {
                e.preventDefault();
                e.stopPropagation();
                dismiss();
                try {
                    const videoEl = containerEl.querySelector('video');
                    if (!videoEl) return;
                    let pl = null;
                    try { if (window.videojs) pl = videojs.getPlayer(videoEl); } catch (_) {}
                    if (pl) {
                        pl.currentTime(0);
                        const pr = pl.play();
                        if (pr && pr.catch) pr.catch(() => {});
                    } else {
                        videoEl.currentTime = 0;
                        const pr = videoEl.play();
                        if (pr && pr.catch) pr.catch(() => {});
                    }
                } catch (_) {}
            });

            badge.appendChild(continueBtn);
            badge.appendChild(startOverBtn);
            containerEl.appendChild(badge);

            let hideTimer = setTimeout(dismiss, 15000);

            function dismiss() {
                clearTimeout(hideTimer);
                if (badge.parentNode) badge.parentNode.removeChild(badge);
            }
        }

        async function loadWatchProgress() {
            if (progressLoaded) return;
            progressLoaded = true;
            try {
                const response = await fetch(progressUrl, { headers: { 'Accept': 'application/json' } });
                if (!response.ok) return;
                const saved = await response.json();
                const duration = Number(player.duration()) || Number(saved.duration_seconds || 0);
                const position = Number(saved.position_seconds || 0);
                if (position > 5 && (!duration || position < duration - 10) && player.currentTime() < position - 5) {
                    showResumeBadge(container, position, () => {
                        player.currentTime(position);
                        const pr = player.play();
                        if (pr && pr.catch) pr.catch(() => {});
                    });
                }
            } catch (error) {
                console.warn('Could not load watch progress', error);
            }
        }

        function saveWatchProgress(force = false) {
            const position = Number(player.currentTime());
            const duration = Number(player.duration());
            if (!Number.isFinite(position) || !Number.isFinite(duration) || position < 1) return;
            if (!force && lastSavedPosition >= 0 && position - lastSavedPosition < 5) return;
            if (document.getElementById('resumeBadge')) return;
            if (saveInFlight && !force) return;
            lastSavedPosition = Math.max(lastSavedPosition, position);
            saveInFlight = true;
            fetch('/api/progress', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                body: JSON.stringify({
                    access_code: progressParams.get('access_code'),
                    lecture_key: progressParams.get('lecture_key'),
                    position_seconds: position,
                    duration_seconds: duration
                }),
                keepalive: force
            }).catch(() => {}).finally(() => { saveInFlight = false; });
        }

        player.on('loadedmetadata', loadWatchProgress);
        player.on('timeupdate', () => saveWatchProgress(false));
        player.on('pause', () => saveWatchProgress(true));
        player.on('ended', () => saveWatchProgress(true));
        window.addEventListener('pagehide', () => saveWatchProgress(true));

        // ─────────────────────────────────────────
        // PLAYER CONTROLS & INTERACTIONS
        // ─────────────────────────────────────────

        // DISABLE LONG PRESS & CONTEXT MENU
        playerElement.addEventListener('contextmenu', e => { e.preventDefault(); e.stopPropagation(); return false; }, true);

        let pressTimer;
        playerElement.addEventListener('touchstart', e => {
            pressTimer = setTimeout(() => { e.preventDefault(); }, 500);
        }, { passive: false });

        playerElement.addEventListener('touchend',  () => clearTimeout(pressTimer));
        playerElement.addEventListener('touchmove', () => clearTimeout(pressTimer));

        // DOUBLE TAP TO SEEK (10s)
        function handleTap(e) {
            if (!isVideo) return;
            const now = Date.now();
            const rect = playerElement.getBoundingClientRect();
            const x = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
            const isLeft = x < rect.width / 2;
            if (now - lastTapTime < 300 && isLeft === lastTapSide) {
                if (isLeft) { player.currentTime(Math.max(0, player.currentTime() - 10)); showIndicator('left', '⏪ 10s'); }
                else { player.currentTime(Math.min(player.duration(), player.currentTime() + 10)); showIndicator('right', '10s ⏩'); }
            }
            lastTapTime = now; lastTapSide = isLeft;
        }

        function showIndicator(side, text) {
            const el = document.createElement('div');
            el.className = `tap-indicator ${side}`;
            el.innerHTML = text;
            container.appendChild(el);
            setTimeout(() => el.remove(), 500);
        }

        player.ready(() => {
            loadWatchProgress();
            playerElement.addEventListener('touchstart', handleTap, { passive: true });
            playerElement.addEventListener('click', handleTap);
        });
    })();
    </script>
</body>
</html>
